version: 2

models:
  - name: stg_vbak
    description: "Sales order header, cleaned and typed"
    columns:
      - name: sales_doc_id
        tests:
          - not_null
      # Not tested for uniqueness -- sales_doc_id repeats across this
      # dataset's 3 SAP clients (MANDT 050/100/250). True uniqueness only
      # holds per (client_id, sales_doc_id), not tested here for now.

  - name: stg_vbap
    description: "Sales order item, cleaned and typed"
    columns:
      - name: sales_doc_id
        tests:
          - not_null
      - name: material_number
        description: "Null is expected for text line items (item_category = TATX) and a small number (~81) of fully-blank placeholder rows, identified by also having a null net_amount."
        tests:
          - not_null:
              config:
                where: "(item_category != 'TATX' or item_category is null) and net_amount is not null"

  - name: stg_vbrk
    description: "Billing document header, cleaned and typed"
    columns:
      - name: billing_doc_id
        tests:
          - not_null
      # Not tested for uniqueness -- same cross-client reuse as sales_doc_id above.

  - name: stg_vbrp
    description: "Billing document item, cleaned and typed"

  - name: stg_ekko
    description: "Purchase order header, cleaned and typed. po_created_on (BEDAT) is the correct field for cycle-time calcs -- changed_on (AEDAT) is last-changed date, not creation date."
    columns:
      - name: po_number
        tests:
          - not_null
      # Not tested for uniqueness -- po_number repeats across the 3 SAP clients.

  - name: stg_ekpo
    description: "Purchase order item, cleaned and typed"

  - name: stg_rbkp
    description: "Vendor invoice header, cleaned and typed"
    columns:
      - name: invoice_doc_id
        tests:
          - not_null

  - name: stg_rseg
    description: "Vendor invoice item, cleaned and typed"

  - name: stg_csks
    description: "Cost center master"

  - name: stg_cskt
    description: "Cost center text"

  - name: stg_makt
    description: "Material description"

  - name: stg_mara
    description: "Material master"
    columns:
      - name: material_number
        tests:
          - not_null
      # Not tested for uniqueness -- material_number repeats across the 3 SAP clients.

  - name: stg_mard
    description: "Material stock"

  - name: stg_t001
    description: "Company codes"
    columns:
      - name: company_code
        tests:
          - not_null
      # Not tested for uniqueness -- company_code repeats across the 3 SAP clients.

  - name: stg_t002
    description: "Language keys"

  - name: stg_tcurr
    description: "Exchange rates"