name: 'sap_dwh'
version: '1.0.0'
config-version: 2

profile: 'sap_dwh'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sap_dwh:
    staging:
      +schema: staging
      +materialized: view
    marts:
      core:
        +schema: analytics
        +materialized: view
      kpi:
        +schema: analytics
        +materialized: view
      ml:
        +schema: analytics
        +materialized: view
      quality:
        +schema: analytics
        +materialized: view
